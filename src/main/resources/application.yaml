spring:
  application:
    name: matrimony-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/matrimony}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
    expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:86400}
  otp:
    expires-in-seconds: ${APP_OTP_EXPIRES_IN_SECONDS:300}
    fixed-code: ${APP_OTP_FIXED_CODE:}
  upload:
    public-base-url: ${APP_UPLOAD_PUBLIC_BASE_URL:https://mithila-matrimony.s3.amazonaws.com}
    bucket-name: ${APP_UPLOAD_BUCKET_NAME:mithila-matrimony}
    region: ${AWS_REGION:ap-south-1}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin123}
